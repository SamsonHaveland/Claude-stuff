# Copy to hermes-control.config.yaml (git-ignored).
server:
  host: 0.0.0.0          # 127.0.0.1 if only using `tailscale serve`; 0.0.0.0 to reach it from your iPhone on the LAN
  port: 8787
  secureCookies: false   # set true once served over HTTPS (tailscale serve)
  allowedOrigins: []     # e.g. ["https://mac.tailnet-name.ts.net"]
dataDir: ./data

hermes:
  mode: disabled         # 'live' only after the API server is enabled (docs/INTEGRATION_PLAN.md step 2)
  home: ~/.hermes        # read-only profile discovery
  baseUrl: http://127.0.0.1:8642
  multiplex: true        # named profiles at /p/<profile>/ (Hermes default)
  cliPath: hermes        # for `hermes kanban ... --json`
  profiles:              # optional presentation overrides; keys are Hermes profile ids
    # Verified profile ids on hermes-pi (hermes profile list, v0.23.0). Roles are display-only.
    jeff:  { role: Chief of Staff }
    harry: { role: Research }
    roxy:  { role: Design & Creative Director }
    debra: { role: Production Accounting }
    lena:  { role: Social Media }
    scout: { role: Outreach }

telegramMirror:          # agents with their own Telegram bot; deploy/pi/enable-telegram-sync.sh turns these on
  - { profile: jeff, enabled: false, twoWay: false, pollSeconds: 5, workspace: general }
  - { profile: debra, enabled: false, twoWay: false, pollSeconds: 5, workspace: general }

workspaces:
  - slug: general
    name: Samson HQ
    agents: ['*']
    channels:
      - { name: general, agents: ['*'], defaultAgent: jeff }
      - { name: production, agents: [jeff, debra, roxy] }
      - { name: research, agents: [jeff, harry] }
  - slug: film-lv
    name: FilmLV
    kanbanTenant: filmlv
    agents: [jeff, debra, roxy, lena]
    channels:
      - { name: film-lv, agents: ['*'], defaultAgent: jeff }
  - slug: atomic-fox
    name: Atomic Fox
    kanbanTenant: atomicfox
    agents: [jeff, harry, lena, scout]
    channels:
      - { name: atomic-fox, agents: ['*'], defaultAgent: jeff }
