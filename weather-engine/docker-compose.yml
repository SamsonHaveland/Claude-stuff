# Runs the collector hourly: fetch forecasts + observations, issue an engine
# forecast, refresh the live scorecard. Data lands in ./data, reports in ./reports.
services:
  collector:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      WE_USER_AGENT: ${WE_USER_AGENT:-weather-engine/0.1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: >
      sh -c "pip install -q -e . &&
             while true; do
               weather-engine collect;
               weather-engine predict;
               weather-engine scorecard;
               sleep 3600;
             done"
    restart: unless-stopped
